<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Symbols</title>
  <style>
    @font-face {
      font-family: 'Material Symbols Rounded';
      src: url('Material_Symbols_Rounded/MaterialSymbolsRounded-VariableFont_FILL,GRAD,opsz,wght.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Material Symbols Sharp';
      src: url('Material_Symbols_Sharp/MaterialSymbolsSharp-VariableFont_FILL,GRAD,opsz,wght.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Material Symbols Outlined';
      src: url('Material_Symbols_Outlined/MaterialSymbolsOutlined-VariableFont_FILL,GRAD,opsz,wght.ttf') format('truetype');
      font-weight: 100 700;
      font-style: normal;
    }
  </style>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 12px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .search-box {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .search-box:focus { border-color: #7c3aed; }
    .search-box::placeholder { color: #666; }

    .selection-info {
      padding: 8px 12px;
      background: #252525;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .selection-badge {
      background: #7c3aed;
      color: white;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .selection-text {
      color: #aaa;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-icon {
      font-family: 'Material Symbols Rounded';
      font-size: 18px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      color: #c084fc;
      flex-shrink: 0;
    }

    .results-count {
      padding: 6px 12px;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }

    .icons-grid {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 4px;
      padding: 8px;
      align-content: start;
    }

    .icons-grid::-webkit-scrollbar { width: 4px; }
    .icons-grid::-webkit-scrollbar-track { background: #1e1e1e; }
    .icons-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.1s;
    }

    .icon-item:hover { background: #2a2a2a; border-color: #444; }
    .icon-item.active { background: #3b1f6e; border-color: #7c3aed; }

    .icon-preview {
      font-family: 'Material Symbols Rounded';
      font-size: 24px;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      user-select: none;
    }

    .icon-name {
      font-size: 9px;
      color: #888;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }


    .no-selection {
      padding: 24px 12px;
      text-align: center;
      color: #666;
      font-size: 12px;
      line-height: 1.6;
    }

    .header-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .style-switcher {
      display: flex;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .style-btn {
      padding: 6px 9px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .style-btn:not(:last-child) { border-right: 1px solid #444; }
    .style-btn.active { background: #3b1f6e; color: #c084fc; }

    .fill-toggle {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      user-select: none;
    }
    .fill-toggle.active {
      background: #3b1f6e;
      border-color: #7c3aed;
      color: #c084fc;
    }
    .fill-toggle .fill-icon {
      font-family: 'Material Symbols Rounded';
      font-size: 16px;
      line-height: 1;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .fill-toggle.active .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .size-input {
      width: 52px;
      flex-shrink: 0;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 8px;
      color: #e0e0e0;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      outline: none;
    }
    .size-input:focus { border-color: #7c3aed; }


    .axis-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .axis-label {
      font-size: 11px;
      color: #666;
      width: 32px;
      flex-shrink: 0;
    }
    .axis-slider {
      flex: 1;
      accent-color: #7c3aed;
      cursor: pointer;
    }
    .axis-value {
      font-size: 11px;
      color: #aaa;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <input class="search-box" type="text" id="search" placeholder="Search icons..." autocomplete="off" />
      <input class="size-input" type="number" id="size-input" value="24" min="8" max="256" title="Font size" />
      <button class="fill-toggle" id="fill-toggle">
        <span class="fill-icon">star</span>
        Fill
      </button>
    </div>
    <div class="header-row" style="margin-top: 8px;">
      <div class="style-switcher">
        <button class="style-btn active" data-style="Rounded">Rounded</button>
        <button class="style-btn" data-style="Sharp">Sharp</button>
        <button class="style-btn" data-style="Outlined">Outlined</button>
      </div>
    </div>
    <div class="axis-row">
      <span class="axis-label">Weight</span>
      <input class="axis-slider" type="range" id="weight-slider" min="100" max="700" step="100" value="400" />
      <span class="axis-value" id="weight-value">400</span>
    </div>
  </div>

  <div class="selection-info" id="selection-info"></div>


  <div class="results-count" id="results-count"></div>

  <div class="icons-grid" id="icons-grid"></div>


  <script src="icons.js"></script>
  <script>
    let selectedShapes = [];
    let selectedIcon = null;
    let fillMode = false;
    let fontStyle = 'Rounded';
    let fontWeight = 400;

    const searchInput = document.getElementById('search');
    const iconsGrid = document.getElementById('icons-grid');
    const selectionInfo = document.getElementById('selection-info');
    const selectionText = document.getElementById('selection-text');
    const resultsCount = document.getElementById('results-count');
    const fillToggle = document.getElementById('fill-toggle');
    const sizeInput = document.getElementById('size-input');
    const weightSlider = document.getElementById('weight-slider');
    const weightValue = document.getElementById('weight-value');

    function getSize() {
      const v = parseInt(sizeInput.value, 10);
      return (isNaN(v) || v < 8) ? 24 : Math.min(v, 256);
    }

    function updateIconPreviews() {
      const fill = fillMode ? 1 : 0;
      document.querySelectorAll('.icon-preview').forEach(el => {
        el.style.fontFamily = `'Material Symbols ${fontStyle}'`;
        el.style.fontVariationSettings = `'FILL' ${fill}, 'wght' ${fontWeight}, 'GRAD' 0, 'opsz' 24`;
      });
    }

    weightSlider.addEventListener('input', () => {
      fontWeight = parseInt(weightSlider.value);
      weightValue.textContent = fontWeight;
      updateIconPreviews();
    });

document.querySelectorAll('.style-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        fontStyle = btn.dataset.style;
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    fillToggle.addEventListener('click', () => {
      fillMode = !fillMode;
      fillToggle.classList.toggle('active', fillMode);
      updateIconPreviews();
    });

    // Render icons grid
    function renderIcons(query) {
      const filtered = query
        ? ICONS.filter(name => name.includes(query.toLowerCase().replace(/\s+/g, '_')))
        : ICONS;

      resultsCount.textContent = `${filtered.length} icons`;
      iconsGrid.innerHTML = '';

      const limit = 200;
      const fillValue = fillMode ? 1 : 0;
      filtered.slice(0, limit).forEach(name => {
        const item = document.createElement('div');
        item.className = 'icon-item' + (name === selectedIcon ? ' active' : '');
        item.innerHTML = `
          <span class="icon-preview" style="font-family: 'Material Symbols ${fontStyle}'; font-variation-settings: 'FILL' ${fillValue}, 'wght' ${fontWeight}, 'GRAD' 0, 'opsz' 24">${name}</span>
          <span class="icon-name">${name.replace(/_/g, ' ')}</span>
        `;
        item.addEventListener('click', () => selectIcon(name));
        iconsGrid.appendChild(item);
      });

      if (filtered.length > limit) {
        resultsCount.textContent += ` (showing ${limit})`;
      }
    }

    function selectIcon(name) {
      selectedIcon = name;
      document.querySelectorAll('.icon-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      const hasTextSelection = selectedShapes.some(s => s.type === 'text');
      if (hasTextSelection) {
        parent.postMessage({ pluginType: 'ms-font', type: 'replace-all-selected', iconName: name, fill: fillMode, size: getSize(), style: fontStyle, weight: fontWeight }, '*');
      } else {
        parent.postMessage({ pluginType: 'ms-font', type: 'place-icon', iconName: name, fill: fillMode, size: getSize(), style: fontStyle, weight: fontWeight }, '*');
      }
    }

    // Update selection info
    function updateSelectionInfo(shapes) {
      selectedShapes = shapes;
      const textShapes = shapes.filter(s => s.type === 'text');

      if (textShapes.length === 0) {
        selectionInfo.innerHTML = '';
      } else if (textShapes.length === 1) {
        const shape = textShapes[0];
        const current = shape.content || '';
        selectionInfo.innerHTML = `
          <span class="current-icon">${current}</span>
          <span class="selection-text"><strong>${shape.name}</strong> — "${current}"</span>
        `;
      } else {
        selectionInfo.innerHTML = `
          <span class="selection-badge">${textShapes.length}</span>
          <span class="selection-text">text layers selected</span>
        `;
      }

    }

    // Search
    searchInput.addEventListener('input', () => {
      renderIcons(searchInput.value);
    });

    // Messages from plugin.js
    window.addEventListener('message', event => {
      const msg = event.data;
      if (!msg || !msg.type) return;
      if (msg.type === 'selection') {
        updateSelectionInfo(msg.shapes || []);
      }
    });

    // Theme
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') {
      document.body.style.background = '#f5f5f5';
      document.body.style.color = '#1e1e1e';
    }

    // Init
    renderIcons('');
    parent.postMessage({ pluginType: 'ms-font', type: 'get-selection' }, '*');
  </script>
</body>
</html>
